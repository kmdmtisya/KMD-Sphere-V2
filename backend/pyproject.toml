[project]
name = "wealthsphere-backend"
version = "0.1.0"
description = "WealthSphere backend (FastAPI modular monolith)"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "asyncpg>=0.30",
  "redis>=5.2",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.14",
  "opentelemetry-sdk>=1.45.1",
  "opentelemetry-exporter-otlp-proto-http>=1.45.1",
  "opentelemetry-instrumentation-fastapi>=0.66b1",
  "opentelemetry-exporter-prometheus>=0.66b1",
  "prometheus-client>=0.26.0",
  "pyjwt[crypto]>=2.10",
  "tzdata>=2025.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "httpx>=0.28",
  "ruff>=0.8",
  "mypy>=1.13",
  "asyncpg-stubs>=0.32.0",
  "hypothesis>=6.168.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "ASYNC", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# Alembic-generated constraint text is long; reviewed as SQL, not wrapped.
"migrations/versions/**" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop per test module, shared by its async fixtures and tests, so module-scoped
# resources (a migrated database, an app with its engine) are usable from every test.
asyncio_default_fixture_loop_scope = "module"
asyncio_default_test_loop_scope = "module"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs the docker compose stack (postgres, redis)",
    "security: security test suite (authentication, authorization/IDOR, tokens, rate limits, audit, headers); run alone with -m security",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
