name: backend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          run=true # fail safe: run the checks unless we can prove nothing relevant changed
          base=""
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; elif [ "$EVENT" = "push" ]; then base="$PUSH_BEFORE"; fi
          if [ -n "$base" ] && ! echo "$base" | grep -qE '^0+$' && git cat-file -e "$base^{commit}" 2>/dev/null; then
            if git diff --name-only "$base" "$GITHUB_SHA" | grep -qE '^(backend/|scripts/|\.github/workflows/backend\.yml)'; then run=true; else run=false; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Relevant changes: $run"

  quality:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: lint, types, tests, migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          # Throwaway credentials for an ephemeral service container reachable only from this job.
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: wealthsphere_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d wealthsphere_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      ENVIRONMENT: test
      POSTGRES_USER: ci_user
      POSTGRES_PASSWORD: ci-only-not-a-secret
      POSTGRES_DB: wealthsphere_ci
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          python-version: "3.13"

      - name: Install dependencies (locked)
        run: uv sync --locked

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: OpenAPI contract is up to date
        run: uv run python ../scripts/export_openapi.py --check

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Lint OpenAPI contract (Spectral)
        run: npx --yes @stoplight/spectral-cli@6.17.0 lint openapi.json --ruleset .spectral.yaml --fail-severity=warn

      - name: Migrations (upgrade, check, downgrade, upgrade)
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head
          test "$(uv run alembic heads | wc -l)" -eq 1

      - name: Tests with coverage (incl. integration against service containers)
        run: uv run pytest --cov --cov-report=xml --cov-report=term-missing --cov-fail-under=85

      - name: Coverage by module (business-critical modules must meet the policy floor)
        run: uv run python ../scripts/coverage_by_module.py coverage.xml --policy coverage-policy.toml --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  backend-gate:
    name: backend gate
    if: always()
    needs: [changes, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to have passed (skipped is only acceptable when nothing relevant changed)
        env:
          RUN: ${{ needs.changes.outputs.run }}
          R_CHANGES: ${{ needs.changes.result }}
          R_QUALITY: ${{ needs.quality.result }}
        run: |
          set -eu
          if [ "$R_QUALITY" = "skipped" ] && [ "$RUN" = "true" ]; then echo "::error::quality was skipped although relevant files changed"; exit 1; fi
          for r in "$R_CHANGES" $R_QUALITY; do
            case "$r" in success|skipped) ;; *) echo "::error::a required job finished with result: $r"; exit 1 ;; esac
          done
          echo "all required jobs passed (or were legitimately skipped)"
