name: mobile

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.5"

defaults:
  run:
    working-directory: mobile/wealthsphere_app

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          run=true # fail safe: run the checks unless we can prove nothing relevant changed
          base=""
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; elif [ "$EVENT" = "push" ]; then base="$PUSH_BEFORE"; fi
          if [ -n "$base" ] && ! echo "$base" | grep -qE '^0+$' && git cat-file -e "$base^{commit}" 2>/dev/null; then
            if git diff --name-only "$base" "$GITHUB_SHA" | grep -qE '^(mobile/|\.github/workflows/mobile\.yml)'; then run=true; else run=false; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Relevant changes: $run"

  analyze-test:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: format, analyze, test (incl. goldens)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies and generate localisation
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      # TEMPORARY (P02-T06): generate golden baselines on Linux; removed again before merge.
      - name: Generate goldens (temporary)
        run: flutter test --update-goldens --tags golden
      - name: Upload generated goldens (temporary)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: generated-goldens
          path: mobile/wealthsphere_app/test/**/goldens/*.png

      # Goldens are only authoritative on this Linux job (see dart_test.yaml).
      - name: Test (unit, widget and golden)
        run: flutter test --coverage

      - name: Upload golden failure diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: golden-failures
          path: mobile/wealthsphere_app/test/**/failures/**
          if-no-files-found: ignore

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mobile-coverage
          path: mobile/wealthsphere_app/coverage/lcov.info
          if-no-files-found: ignore

  build-android:
    name: android debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: analyze-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get && flutter gen-l10n
      - run: flutter build apk --debug

  build-ios:
    name: ios compile (no codesign)
    runs-on: macos-latest
    timeout-minutes: 40
    needs: analyze-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get && flutter gen-l10n
      - name: Build iOS (no code signing)
        run: flutter build ios --no-codesign

  mobile-gate:
    name: mobile gate
    if: always()
    needs: [changes, analyze-test, build-android, build-ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ${{ github.workspace }} # this job does not check out the repository
    steps:
      - name: Require every job to have passed (skipped is only acceptable when nothing relevant changed)
        env:
          RUN: ${{ needs.changes.outputs.run }}
          R_CHANGES: ${{ needs.changes.result }}
          R_ANALYZE_TEST: ${{ needs.analyze-test.result }}
          R_BUILD_ANDROID: ${{ needs.build-android.result }}
          R_BUILD_IOS: ${{ needs.build-ios.result }}
        run: |
          set -eu
          if [ "$R_ANALYZE_TEST" = "skipped" ] && [ "$RUN" = "true" ]; then echo "::error::analyze-test was skipped although relevant files changed"; exit 1; fi
          if [ "$R_BUILD_ANDROID" = "skipped" ] && [ "$RUN" = "true" ]; then echo "::error::build-android was skipped although relevant files changed"; exit 1; fi
          if [ "$R_BUILD_IOS" = "skipped" ] && [ "$RUN" = "true" ]; then echo "::error::build-ios was skipped although relevant files changed"; exit 1; fi
          for r in "$R_CHANGES" $R_ANALYZE_TEST $R_BUILD_ANDROID $R_BUILD_IOS; do
            case "$r" in success|skipped) ;; *) echo "::error::a required job finished with result: $r"; exit 1 ;; esac
          done
          echo "all required jobs passed (or were legitimately skipped)"
