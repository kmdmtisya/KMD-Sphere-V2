name: tracker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tracker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: tracker validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Execution tracker consistency (tasks, dependencies, waves, quality gates, timestamps)
        run: python3 scripts/track.py validate
