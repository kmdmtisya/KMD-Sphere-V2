name: web

# The web portal (P14-T04, ADR-0018): lint (including the money-arithmetic and colour-literal
# guards and their self-test), type check, unit tests, the generated API client's drift check and
# the production build; then Playwright against the standalone server with the seeded backend e2e
# server beside it. "web gate" becomes a required check in P14-T21.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

defaults:
  run:
    working-directory: web

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          run=true # fail safe: run the checks unless we can prove nothing relevant changed
          base=""
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; elif [ "$EVENT" = "push" ]; then base="$PUSH_BEFORE"; fi
          if [ -n "$base" ] && ! echo "$base" | grep -qE '^0+$' && git cat-file -e "$base^{commit}" 2>/dev/null; then
            # The API contract is part of the web build (the generated client), so it triggers the checks too.
            if git diff --name-only "$base" "$GITHUB_SHA" | grep -qE '^(web/|design/tokens/|scripts/generate_tokens\.py|scripts/keycloak_dev\.py|infra/keycloak/|mobile/wealthsphere_app/lib/shared/design_system/tokens/brand_palette\.dart|mobile/wealthsphere_app/lib/app/app_routes\.dart|scripts/check_route_parity\.py|backend/openapi\.json|backend/app/|backend/tests/e2e_server\.py|\.github/workflows/web\.yml)'; then run=true; else run=false; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Relevant changes: $run"

  check:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: lint, types, tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies (locked)
        run: npm ci

      - name: Mobile and web destinations agree (route parity, QG-28.1)
        working-directory: ${{ github.workspace }}
        run: python3 scripts/check_route_parity.py

      - name: Design tokens (Dart and CSS) match design/tokens and pass the contrast check
        working-directory: ${{ github.workspace }}
        run: python3 scripts/generate_tokens.py --check

      - name: Generated API client matches backend/openapi.json
        run: npm run api:check

      - name: Lint (ESLint with the WealthSphere guards, CSS colour check)
        run: npm run lint

      - name: Lint guards fire on their seeded violations
        run: npm run lint:selftest

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  e2e:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: end-to-end (Playwright, Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # The whole stack: PostgreSQL and Redis services, a throwaway Keycloak with the development realm,
    # the API verifying real Keycloak tokens, and the web BFF (P14-T05). Every credential below is
    # generated for this run or is a fixed throwaway value for containers reachable only from it.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: wealthsphere_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d wealthsphere_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      ENVIRONMENT: test
      POSTGRES_USER: ci_user
      POSTGRES_PASSWORD: ci-only-not-a-secret
      POSTGRES_DB: wealthsphere_ci
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      KEYCLOAK_PORT: "8081"
      KEYCLOAK_ADMIN: admin
      OIDC_ISSUER: http://127.0.0.1:8081/realms/wealthsphere

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate throwaway passwords for this run
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          admin="$(openssl rand -hex 24)"
          user="Aa1!$(openssl rand -hex 12)"
          echo "::add-mask::$admin"
          echo "::add-mask::$user"
          { echo "KEYCLOAK_ADMIN_PASSWORD=$admin"; echo "KEYCLOAK_TEST_USER_PASSWORD=$user"; echo "WS_E2E_PASSWORD=$user"; } >> "$GITHUB_ENV"

      - name: Start Keycloak with the development realm
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          docker run -d --name keycloak -p 127.0.0.1:8081:8080 -p 127.0.0.1:9001:9000             -v "$GITHUB_WORKSPACE/infra/keycloak:/opt/keycloak/data/import:ro"             -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD="$KEYCLOAK_ADMIN_PASSWORD"             -e KC_HEALTH_ENABLED=true             quay.io/keycloak/keycloak:26.4 start-dev --import-realm

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          python-version: "3.13"

      - name: Install backend dependencies (locked)
        working-directory: backend
        run: uv sync --locked

      - name: Migrate the database and start the API
        working-directory: backend
        run: |
          set -euo pipefail
          uv run alembic upgrade head
          # Per-user rate limits (covered by the backend suite) are off here: the journeys make many calls as one user.
          RATE_LIMIT_ENABLED=false nohup uv run uvicorn app.main:app --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/health/ready > /dev/null && exit 0; sleep 2; done
          echo "API did not start"; tail -50 "$RUNNER_TEMP/api.log"; exit 1

      - name: Wait for Keycloak, seed the test users, register the web client
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:9001/health/ready > /dev/null && break; sleep 2; done
          python3 scripts/keycloak_dev.py seed-users
          python3 scripts/keycloak_dev.py web-client

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies (locked)
        run: npm ci

      - name: Install the browsers for Playwright (Chromium, Firefox)
        run: npx playwright install --with-deps chromium firefox

      # This build is for the tests only and includes the component gallery; deployed builds never do.
      - name: Production build (with the component gallery)
        env:
          WS_ENABLE_GALLERY: "1"
        run: npm run build

      - name: Playwright (smoke, gallery, sign-in and sessions)
        env:
          CI: "true"
          WS_API_BASE_URL: http://127.0.0.1:8000
          WS_E2E_EXPECT_API: "1"
          WS_E2E_AUTH: "1"
        run: npm run e2e

      # The cross-browser journeys (P14-T20.4, QG-32): five widths, both themes, the main interactions.
      # WebKit (Safari's engine) is not run here: the portal's __Host- Secure session cookies are not
      # stored over plain HTTP by WebKit, so it needs an HTTPS test deployment (staging, P14-T22).
      - name: Playwright (Firefox journeys)
        env:
          CI: "true"
          WS_API_BASE_URL: http://127.0.0.1:8000
          WS_E2E_EXPECT_API: "1"
          WS_E2E_AUTH: "1"
          WS_BROWSERS: firefox
        run: npx playwright test --project=firefox

      # The forex workspace (P14-T24): the API is restarted with the forex module on and the simulated
      # feed, one-minute candles are stored, and the forex journeys run in Chromium and Firefox
      # (paper trading, notices, candle chart, streaming responsiveness, no real-money order).
      - name: Restart the API with the forex module on and store candles
        working-directory: backend
        env:
          FOREX_ENABLED: "true"
          FOREX_FEED_ENABLED: "true"
          FOREX_CANDLE_SYNC_MAX_HOURS: "168"
          RATE_LIMIT_ENABLED: "false"
        run: |
          set -euo pipefail
          pkill -f "uvicorn app.main:app" || true
          sleep 2
          nohup uv run uvicorn app.main:app --port 8000 > "$RUNNER_TEMP/api-forex.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/health/ready > /dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:8000/health/ready > /dev/null || { tail -50 "$RUNNER_TEMP/api-forex.log"; exit 1; }
          uv run python -c "from app.worker.tasks import forex_candle_sync_job; print(forex_candle_sync_job())"

      - name: Playwright (forex workspace, Chromium and Firefox)
        env:
          CI: "true"
          WS_API_BASE_URL: http://127.0.0.1:8000
          WS_E2E_EXPECT_API: "1"
          WS_E2E_AUTH: "1"
          WS_E2E_FOREX: "1"
          WS_BROWSERS: firefox
        run: npx playwright test e2e/forex.spec.ts e2e/forex-workspace.spec.ts e2e/forex-live.spec.ts --project=chromium --project=firefox

      - name: Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

      - name: API and Keycloak logs (on failure)
        if: failure()
        working-directory: ${{ github.workspace }}
        run: |
          tail -100 "$RUNNER_TEMP/api.log" || true
          docker logs --tail 100 keycloak || true

  gate:
    name: web gate
    if: always()
    needs: [changes, check, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ${{ github.workspace }} # this job does not check out the repository
    steps:
      - name: Require every job to have passed (skipped is only acceptable when nothing relevant changed)
        env:
          RUN: ${{ needs.changes.outputs.run }}
          R_CHANGES: ${{ needs.changes.result }}
          R_CHECK: ${{ needs.check.result }}
          R_E2E: ${{ needs.e2e.result }}
        run: |
          set -eu
          if [ "$R_CHANGES" != "success" ]; then echo "::error::change detection did not succeed"; exit 1; fi
          for pair in "check:$R_CHECK" "e2e:$R_E2E"; do
            job="${pair%%:*}"; result="${pair#*:}"
            if [ "$result" = "skipped" ] && [ "$RUN" = "true" ]; then echo "::error::$job was skipped although relevant files changed"; exit 1; fi
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then echo "::error::$job finished with $result"; exit 1; fi
          done
          echo "web gate passed"
